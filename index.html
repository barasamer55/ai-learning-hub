<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Hub | Bara Samer</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1337ec",
                        "primary-hover": "#2e4df5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101322",
                        "surface-dark": "#181b2c",
                        "border-dark": "#282b39",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.375rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-dark text-slate-100 flex min-h-screen overflow-hidden">
    <!-- Auth Overlay -->
    <div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-background-dark hidden">
        <div class="flex flex-col items-center gap-6 p-8 bg-surface-dark rounded-2xl border border-border-dark shadow-2xl">
            <span class="material-symbols-outlined text-6xl text-primary">psychology</span>
            <h1 class="text-2xl font-bold">AI Learning Hub</h1>
            <p class="text-slate-400 text-center max-w-sm">Sign in to track your AI and DSA learning progress.</p>
            <button id="login-btn" class="px-6 py-3 bg-white text-black rounded-lg font-medium flex items-center gap-2 hover:bg-slate-200 transition-colors">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Main Layout (Hidden until Auth) -->
    <div id="app-layout" class="flex w-full h-screen overflow-hidden hidden">
        <!-- Sidebar -->
        <aside class="w-64 flex flex-col justify-between border-r border-border-dark bg-[#111218] flex-shrink-0 h-screen overflow-y-auto">
            <div class="p-4 flex flex-col gap-6">
                <!-- User Profile -->
                <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 transition-colors cursor-pointer group">
                    <div class="rounded-full size-10 border border-white/10 relative overflow-hidden">
                        <img id="user-avatar" alt="User" class="w-full h-full object-cover" src="">
                    </div>
                    <div class="flex flex-col">
                        <h1 id="user-name" class="text-white text-sm font-medium leading-tight">Bara Samer</h1>
                        <p id="user-track" class="text-slate-400 text-xs font-normal leading-tight">AI + DSA 6-Month Sprint</p>
                    </div>
                </div>

                <!-- Navigation -->
                <nav class="flex flex-col gap-1" id="main-nav">
                    <a href="#dashboard" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all" data-view="dashboard">
                        <span class="material-symbols-outlined">dashboard</span>
                        <span class="text-sm font-medium">Dashboard</span>
                    </a>
                    <a href="#dsa" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all" data-view="dsa">
                        <span class="material-symbols-outlined">code</span>
                        <span class="text-sm font-medium">DSA</span>
                    </a>
                    <a href="#courses" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all" data-view="courses">
                        <span class="material-symbols-outlined">school</span>
                        <span class="text-sm font-medium">Courses</span>
                    </a>
                    <a href="#knowledge" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all" data-view="knowledge">
                        <span class="material-symbols-outlined">library_books</span>
                        <span class="text-sm font-medium">Knowledge</span>
                    </a>
                    <a href="#projects" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all" data-view="projects">
                        <span class="material-symbols-outlined">folder</span>
                        <span class="text-sm font-medium">Projects</span>
                    </a>
                </nav>
            </div>

            <div class="p-4 border-t border-border-dark">
                <button id="logout-btn" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all mb-1 w-full text-left">
                    <span class="material-symbols-outlined">logout</span>
                    <span class="text-sm font-medium">Log Out</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-background-dark relative">
            <!-- Header -->
            <header class="sticky top-0 z-20 bg-background-dark/80 backdrop-blur-md border-b border-border-dark px-8 py-5 flex items-center justify-between">
                <div class="flex flex-col gap-1">
                    <div class="flex items-center gap-2 text-slate-500 text-sm">
                        <span>Home</span>
                        <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                        <span id="breadcrumb-view" class="text-slate-200 capitalize">Dashboard</span>
                    </div>
                    <h2 id="header-title" class="text-2xl font-bold text-slate-100 tracking-tight">Overview</h2>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-surface-dark border border-border-dark rounded-full px-3 py-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-xs font-medium text-slate-300">System Online</span>
                    </div>
                    <button class="flex items-center justify-center p-2 rounded-full text-slate-400 hover:text-white hover:bg-surface-dark transition-all relative">
                        <span class="material-symbols-outlined">notifications</span>
                        <span class="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full border border-background-dark"></span>
                    </button>
                </div>
            </header>

            <!-- Page Content Container -->
            <div id="page-content" class="flex-1">
                <!-- Content injected here -->
            </div>
        </main>
    </div>

    <!-- Supabase & App Scripts -->
    <script type="module" src="/assets/supabase.js"></script>
    <script type="module" src="/assets/app.js"></script>
</body>
</html>
