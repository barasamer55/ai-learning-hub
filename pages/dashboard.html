<div class="p-8 max-w-[1400px] w-full mx-auto flex flex-col gap-8">
    <!-- Welcome Block -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
        <div class="flex flex-col gap-2 max-w-2xl">
            <h1 class="text-4xl font-bold text-white tracking-tight">Week 1 of 24</h1>
            <p class="text-slate-400 text-lg">Welcome back, Bara. Let's start your AI + DSA 6-Month Sprint journey.</p>
        </div>
        <div class="flex items-center gap-3">
            <button class="bg-primary hover:bg-primary-hover text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-lg shadow-primary/20">
                <span class="material-symbols-outlined text-[20px]">play_circle</span>
                Resume Learning
            </button>
        </div>
    </div>

    <!-- Stats Overview Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Mastery Widget -->
        <div class="bg-surface-dark border border-border-dark rounded-xl p-6 flex items-center justify-between relative overflow-hidden group hover:border-primary/30 transition-colors">
            <div class="flex flex-col gap-1 z-10">
                <span class="text-slate-400 text-sm font-medium">Total Mastery</span>
                <div class="flex items-baseline gap-2">
                    <span id="total-mastery" class="text-3xl font-bold text-white">0%</span>
                </div>
                <p class="text-xs text-slate-500 mt-2">On track for 6-month goal</p>
            </div>
            <div class="w-20 h-20 z-10">
                <div class="radial-progress-container w-full h-full">
                    <div class="radial-progress-bg"></div>
                    <div class="radial-progress-inner"></div>
                </div>
            </div>
            <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
        </div>

        <!-- Daily Streak -->
        <div class="bg-surface-dark border border-border-dark rounded-xl p-6 flex flex-col justify-between relative overflow-hidden group hover:border-orange-500/30 transition-colors">
            <div class="flex justify-between items-start z-10">
                <div class="flex flex-col gap-1">
                    <span class="text-slate-400 text-sm font-medium">Daily Streak</span>
                    <div class="flex items-baseline gap-2">
                        <span id="daily-streak" class="text-3xl font-bold text-white">0</span>
                        <span class="text-slate-400 text-sm">Days</span>
                    </div>
                </div>
                <div class="p-2 bg-orange-500/10 rounded-lg text-orange-500">
                    <span class="material-symbols-outlined">local_fire_department</span>
                </div>
            </div>
            <div class="flex gap-1 mt-4 z-10">
                <div class="h-8 flex-1 bg-slate-800 rounded-sm"></div>
                <div class="h-8 flex-1 bg-slate-800 rounded-sm"></div>
                <div class="h-8 flex-1 bg-slate-800 rounded-sm"></div>
                <div class="h-8 flex-1 bg-slate-800 rounded-sm"></div>
                <div class="h-8 flex-1 bg-slate-800 rounded-sm"></div>
                <div class="h-8 flex-1 bg-slate-800 rounded-sm"></div>
                <div class="h-8 flex-1 bg-slate-800 rounded-sm"></div>
            </div>
        </div>

        <!-- Time Invested -->
        <div class="bg-surface-dark border border-border-dark rounded-xl p-6 flex flex-col justify-between relative overflow-hidden group hover:border-purple-500/30 transition-colors">
            <div class="flex justify-between items-start z-10">
                <div class="flex flex-col gap-1">
                    <span class="text-slate-400 text-sm font-medium">Time Invested</span>
                    <div class="flex items-baseline gap-2">
                        <span id="time-invested" class="text-3xl font-bold text-white">0h</span>
                        <span class="text-slate-400 text-sm">Total</span>
                    </div>
                </div>
                <div class="p-2 bg-purple-500/10 rounded-lg text-purple-500">
                    <span class="material-symbols-outlined">schedule</span>
                </div>
            </div>
            <div class="mt-4 z-10">
                <div class="flex justify-between text-xs text-slate-500 mb-1">
                    <span>This Week</span>
                    <span>12h Goal</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div class="bg-purple-600 h-2 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Focus Banner -->
    <div class="w-full rounded-xl bg-gradient-to-r from-[#1c223a] to-[#111218] border border-border-dark p-1 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
        <div class="flex flex-col md:flex-row items-center justify-between px-6 py-5 gap-4 relative z-10">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-primary/20 rounded-lg text-primary">
                    <span class="material-symbols-outlined">lightbulb</span>
                </div>
                <div>
                    <h3 class="text-lg font-semibold text-white">Current Focus: Arrays & Hashing</h3>
                    <p class="text-slate-400 text-sm">DSA Module 1 • NeetCode 150</p>
                </div>
            </div>
            <button onclick="window.location.hash='dsa'" class="text-sm font-medium text-white hover:text-primary transition-colors flex items-center gap-1 whitespace-nowrap">
                Go to DSA <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
            </button>
        </div>
        <div class="absolute right-0 top-0 h-full w-1/3 bg-gradient-to-l from-primary/5 to-transparent pointer-events-none"></div>
    </div>
</div>
