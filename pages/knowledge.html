<div class="p-8 max-w-[1400px] mx-auto flex flex-col gap-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Note Form -->
        <div class="lg:col-span-1">
            <div class="bg-surface-dark border border-border-dark rounded-xl p-6 sticky top-24">
                <h3 class="text-lg font-bold text-white mb-4">New Note</h3>
                <form id="note-form" onsubmit="addNote(event)" class="flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-500 font-bold uppercase">Title</label>
                        <input id="note-title" type="text" class="bg-slate-800 border-none rounded-lg text-sm text-white focus:ring-1 focus:ring-primary" placeholder="Note title...">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-500 font-bold uppercase">Category</label>
                        <select id="note-category" class="bg-slate-800 border-none rounded-lg text-sm text-white focus:ring-1 focus:ring-primary">
                            <option value="Notes">Notes</option>
                            <option value="Papers">Papers</option>
                            <option value="Summaries">Summaries</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-500 font-bold uppercase">Content (Markdown)</label>
                        <textarea id="note-content" rows="6" class="bg-slate-800 border-none rounded-lg text-sm text-white focus:ring-1 focus:ring-primary" placeholder="Write your note here..."></textarea>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-primary hover:bg-primary-hover text-white rounded-lg text-sm font-medium transition-colors">Save Note</button>
                </form>
            </div>
        </div>

        <!-- Notes List -->
        <div class="lg:col-span-2">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-white">Knowledge Base</h3>
                <div class="flex gap-2">
                    <span class="text-xs text-slate-500">Sections: Notes, Papers, Summaries</span>
                </div>
            </div>
            <div id="notes-list" class="grid grid-cols-1 gap-4">
                <!-- Notes injected by app.js -->
            </div>
        </div>
    </div>
</div>
