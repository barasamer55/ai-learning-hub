<div class="p-8 max-w-[1400px] mx-auto flex flex-col gap-8">
    <!-- Stats & Heatmap Section -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Progress Card -->
        <div class="bg-surface-dark rounded-xl p-6 border border-border-dark flex flex-col justify-between shadow-sm">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-slate-400 font-medium text-sm">Total Solved</h3>
                    <div class="mt-2 flex items-baseline gap-2">
                        <span id="total-solved" class="text-4xl font-bold text-white font-mono">0</span>
                        <span class="text-slate-400 text-sm font-medium">/ 150</span>
                    </div>
                </div>
                <div class="h-10 w-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                    <span class="material-symbols-outlined">trophy</span>
                </div>
            </div>
            <div class="mt-6">
                <div class="flex justify-between text-xs text-slate-400 mb-2 font-medium uppercase tracking-wider">
                    <span>Progress</span>
                    <span>0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                    <div class="bg-primary h-2.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Difficulty Breakdown -->
        <div class="bg-surface-dark rounded-xl p-6 border border-border-dark shadow-sm">
            <h3 class="text-slate-400 font-medium text-sm mb-4">Difficulty Breakdown</h3>
            <div class="flex flex-col gap-4">
                <div>
                    <div class="flex justify-between text-sm mb-1.5">
                        <span class="text-emerald-500 font-medium">Easy</span>
                        <span id="easy-solved" class="text-slate-400 font-mono text-xs">0</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-1.5">
                        <div class="bg-emerald-500 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1.5">
                        <span class="text-amber-500 font-medium">Medium</span>
                        <span id="medium-solved" class="text-slate-400 font-mono text-xs">0</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-1.5">
                        <div class="bg-amber-500 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1.5">
                        <span class="text-rose-500 font-medium">Hard</span>
                        <span id="hard-solved" class="text-slate-400 font-mono text-xs">0</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-1.5">
                        <div class="bg-rose-500 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Heatmap -->
        <div class="bg-surface-dark rounded-xl p-6 border border-border-dark flex flex-col shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-slate-400 font-medium text-sm">Activity (Last 6 Months)</h3>
                <span class="text-xs text-primary bg-primary/10 px-2 py-1 rounded font-medium">0% vs last month</span>
            </div>
            <div class="flex-1 flex flex-col gap-1 justify-center">
                <div class="heatmap-grid">
                    ${Array.from({ length: 12 }).map(() => `
                        <div class="heatmap-col">
                            ${Array.from({ length: 5 }).map(() => `<div class="heatmap-block bg-heatmap-0"></div>`).join('')}
                        </div>
                    `).join('')}
                </div>
                <div class="flex justify-between text-[10px] text-slate-500 mt-2 font-mono uppercase">
                    <span>Jan</span>
                    <span>Jun</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Topic Grid -->
    <section>
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-white">Topics</h3>
            <div class="flex gap-2">
                <button class="px-3 py-1.5 text-xs font-medium bg-primary text-white rounded-lg">Grid View</button>
                <button class="px-3 py-1.5 text-xs font-medium bg-slate-800 text-slate-500 rounded-lg">List View</button>
            </div>
        </div>
        <div id="topic-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Topics injected by app.js -->
        </div>
    </section>
</div>
